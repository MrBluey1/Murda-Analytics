<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edge Analytics</title>
<style>
:root{--bg:#0a0a0c;--p:#131318;--p2:#1a1a21;--b:#26262f;--t:#ececf1;--m:#9a9aa8;--g:#3ddc97;--r:#ff5d6c;--a:#6c8cff}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 30% at 20% 10%,#6c8cff22,transparent),radial-gradient(35% 30% at 85% 80%,#3ddc9718,transparent);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.08)}}
header{display:flex;gap:8px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--b);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;background:#0a0a0ccc;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.5px;margin-right:16px}.logo b{color:var(--g)}
nav button,.chip{background:none;border:1px solid transparent;color:var(--m);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit;transition:.2s}
nav button:hover,.chip{text-decoration:none;font-size:13px}.chip:hover{color:var(--t);background:var(--p2)}
nav button.on,.chip.on{color:var(--t);background:var(--p2);border-color:var(--b)}
main{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
.view{animation:in .4s cubic-bezier(.2,.7,.2,1)}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card{background:linear-gradient(180deg,var(--p),#101015);border:1px solid var(--b);border-radius:16px;padding:18px;margin-bottom:16px;transition:border-color .2s,transform .2s}
.card:hover{border-color:#3a3a48}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.game{display:flex;flex-direction:column;gap:4px}.game .row{display:flex;justify-content:space-between}
.live{color:var(--r);font-size:12px;font-weight:700}.m{color:var(--m);font-size:13px}
input,select{background:var(--p2);border:1px solid var(--b);color:var(--t);padding:9px 12px;border-radius:10px;font:inherit;outline:none}
input:focus,select:focus,button:focus-visible{border-color:var(--a);outline:2px solid #6c8cff55}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--p2);border-radius:12px;padding:12px}.stat .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.stat .l{color:var(--m);font-size:12px}
.g{color:var(--g)}.r{color:var(--r)}
.res{display:flex;gap:6px;flex-wrap:wrap}.pill{padding:3px 9px;border-radius:8px;font-size:13px;font-variant-numeric:tabular-nums;animation:in .4s backwards}
.pill.o{background:#3ddc9722;color:var(--g)}.pill.u{background:#ff5d6c22;color:var(--r)}
.hit{padding:9px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between}.hit:hover{background:var(--p2)}
svg text{fill:var(--m);font-size:11px}
.path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}
.bx{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) backwards}@keyframes grow{from{transform:scaleY(0)}}.bx:hover{fill-opacity:1;filter:brightness(1.2)}
.dot{opacity:0;animation:in .4s forwards}.dot:hover{r:7}
.sk{height:70px;border-radius:12px;background:linear-gradient(90deg,var(--p) 25%,var(--p2) 50%,var(--p) 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.err{color:var(--r);background:#ff5d6c14;border:1px solid #ff5d6c40;padding:10px 14px;border-radius:10px}
details summary{cursor:pointer;color:var(--m)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.path{stroke-dashoffset:0}.dot{opacity:1}}
</style></head><body>
<header><div class="logo">EDGE<b>/</b>ANALYTICS</div>
<nav id="nav"><button data-v="live" class="on">Live Games</button><button data-v="research">Player Research</button><button data-v="fav">Favorites</button><button data-v="src">Data Sources</button></nav></header>
<main id="app"></main>
<script>
const $=(s,e=document)=>e.querySelector(s);
const PROXY=location.protocol.startsWith("http")&&location.port==="8787";
const J=async(u)=>{let r;try{r=await fetch(PROXY?"/proxy?u="+encodeURIComponent(u):u)}catch(e){throw new Error(PROXY?"network blocked or offline":"browser blocked the request; start the local server with: node server.js")}
 if(!r.ok)throw new Error(r.status+" from "+new URL(u).hostname);return r.json()};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const stamp=()=>new Date().toLocaleTimeString();
const ip=s=>{const[a,b]=String(s||"0").split(".");return +a+(+b||0)/3};

/* ---------- PROVIDERS (player data) ---------- */
const SEASON=new Date().getFullYear()-(new Date().getMonth()<2?1:0);
const P={
 mlb:{label:"MLB",src:"MLB Stats API (statsapi.mlb.com)",
  async search(q){const d=await J("https://statsapi.mlb.com/api/v1/people/search?names="+encodeURIComponent(q));
   return (d.people||[]).slice(0,8).map(p=>({id:p.id,name:p.fullName,team:p.currentTeam?.name||"",pos:p.primaryPosition?.abbreviation||""}))},
  async logs(p){const g=p.pos==="P"?"pitching":"hitting";
   const d=await J(`https://statsapi.mlb.com/api/v1/people/${p.id}/stats?stats=gameLog&group=${g}&season=${SEASON}`);
   const s=d.stats?.[0]?.splits||[];
   const stats=g==="pitching"?{Strikeouts:x=>x.strikeOuts,"Innings":x=>ip(x.inningsPitched),"Earned Runs":x=>x.earnedRuns,"Hits Allowed":x=>x.hits,Walks:x=>x.baseOnBalls}
    :{Hits:x=>x.hits,"Home Runs":x=>x.homeRuns,Runs:x=>x.runs,RBIs:x=>x.rbi,"Total Bases":x=>x.totalBases,"Stolen Bases":x=>x.stolenBases,Strikeouts:x=>x.strikeOuts};
   return{stats,games:s.map(x=>({date:x.date,opp:x.opponent?.name||"?",home:!!x.isHome,raw:x.stat}))}}},
 nhl:{label:"NHL",src:"NHL Web API (api-web.nhle.com)",
  async search(q){const d=await J("https://search.d3.nhle.com/api/v1/search/player?culture=en-us&limit=8&q="+encodeURIComponent(q));
   return d.map(p=>({id:p.playerId,name:p.name,team:p.teamAbbrev||"",pos:p.positionCode||""}))},
  async logs(p){const d=await J(`https://api-web.nhle.com/v1/player/${p.id}/game-log/now`);
   const stats=p.pos==="G"?{Saves:x=>x.shotsAgainst-x.goalsAgainst,"Shots Against":x=>x.shotsAgainst,"Goals Against":x=>x.goalsAgainst}
    :{Goals:x=>x.goals,Assists:x=>x.assists,Points:x=>x.points,"Shots on Goal":x=>x.shots};
   return{stats,games:(d.gameLog||[]).slice().reverse().map(x=>({date:x.gameDate,opp:x.opponentAbbrev,home:x.homeRoadFlag==="H",raw:x}))}}}
};

const STATIC_BASE=(()=>{try{const q=new URLSearchParams(location.search).get("data");if(q)localStorage.setItem("dataBase",q);return(q||localStorage.getItem("dataBase")||"").replace(/\/$/,"")}catch{return""}})();
const staticUrl=u=>{let m;
 if(m=u.match(/^\/api\/(\w+)\/scoreboard/))return`${STATIC_BASE}/scoreboard/${m[1]}.json`;
 if(m=u.match(/^\/api\/(\w+)\/players\?/))return`${STATIC_BASE}/players/${m[1]}/index.json`;
 if(m=u.match(/^\/api\/(\w+)\/players\/([^/]+)\/gamelog/))return`${STATIC_BASE}/players/${m[1]}/${m[2]}.json`;
 return null};
/* Data access: live local API first; falls back to GitHub Pages snapshots when the local server is unavailable. */
const A=async u=>{let err;
 if(PROXY){try{const r=await fetch(u),d=await r.json().catch(()=>({}));if(d.ok)return d;err=new Error(d.error||"API error "+r.status)}catch(e){err=e}}
 const su=STATIC_BASE&&staticUrl(u);
 if(!su)throw err||new Error("no data source: run node server.js (open http://localhost:8787) or add ?data=https://USER.github.io/REPO to the address once");
 let r;try{r=await fetch(su+"?t="+Math.floor(Date.now()/60000))}catch{throw new Error("could not reach "+STATIC_BASE)}
 const d=await r.json().catch(()=>({}));
 if(r.status===404)throw new Error("not collected yet. Snapshots only include players listed in config/tracked.json");
 if(!r.ok||!d.ok)throw new Error(d.error||"snapshot error "+r.status);
 if(/players\?/.test(u)){const q=decodeURIComponent(u.split("q=")[1]||"").toLowerCase();d.data={players:d.data.players.filter(p=>p.name.toLowerCase().includes(q))}}
 return{...d,static:true,fallback:!!PROXY}};
const pretty=k=>k.replace(/([a-z])([A-Z])/g,"$1 $2").replace(/^./,c=>c.toUpperCase());
const viaApi=(k,label)=>({label,src:"ESPN/MLB/NHL public APIs via local API, or GitHub Actions snapshot (unofficial)",
 async search(q){return (await A(`/api/${k}/players?q=${encodeURIComponent(q)}`)).data.players},
 async logs(p){const d=(await A(`/api/${k}/players/${p.id}/gamelog`)).data,stats={};
  d.statKeys.forEach(key=>stats[pretty(key)]=x=>x[key]);
  return{stats,games:d.games.map(g=>({date:g.date,opp:g.opponent,home:g.home,raw:g.stats}))}}});
if(!PROXY&&STATIC_BASE){P.mlb=viaApi("mlb","MLB");P.nhl=viaApi("nhl","NHL")}
Object.assign(P,{nba:viaApi("nba","NBA"),wnba:viaApi("wnba","WNBA"),nfl:viaApi("nfl","NFL"),ncaab:viaApi("ncaab","NCAA Basketball"),ncaaf:viaApi("ncaaf","NCAA Football")});
const KEY={NBA:"nba",WNBA:"wnba",NFL:"nfl",MLB:"mlb",NHL:"nhl",NCAAF:"ncaaf",NCAAB:"ncaab","Premier League":"epl","La Liga":"laliga",MLS:"mls","Champions League":"ucl"};

/* ---------- LIVE SCORES (ESPN public endpoints, unofficial) ---------- */
const LEAGUES={NBA:"basketball/nba",WNBA:"basketball/wnba",NFL:"football/nfl",MLB:"baseball/mlb",NHL:"hockey/nhl","NCAAF":"football/college-football","NCAAB":"basketball/mens-college-basketball","Premier League":"soccer/eng.1","La Liga":"soccer/esp.1",MLS:"soccer/usa.1","Champions League":"soccer/uefa.champions"};
let lg="NBA",liveTimer;
async function live(){
 clearTimeout(liveTimer);
 $("#app").innerHTML=`<div class="view"><div class="bar" id="lgs">${Object.keys(LEAGUES).map(k=>`<button class="chip ${k===lg?"on":""}" data-l="${k}">${k}</button>`).join("")}</div><div id="gm" class="grid">${'<div class="sk"></div>'.repeat(6)}</div><p class="m" id="ts"></p></div>`;
 $("#lgs").onclick=e=>{if(e.target.dataset.l){lg=e.target.dataset.l;live()}};
 let first=true;
 const load=async()=>{
  if(!$("#gm"))return;
  if(document.hidden){liveTimer=setTimeout(load,30e3);return}
  let delay=60e3;
  try{const r=await A(`/api/${KEY[lg]}/scoreboard`),gs=r.data.games;
   $("#gm").innerHTML=gs.length?gs.map((g,i)=>{const row=t=>`<div class="row"><span>${esc(t?.name)}</span><b>${g.state==="scheduled"?"":esc(t?.score)}</b></div>`;
    return`<div class="card game" ${first?`style="animation:in .4s ${i*40}ms backwards"`:'style="animation:none"'}>${g.state==="live"?'<span class="live">● LIVE</span>':""}${row(g.away)}${row(g.home)}<span class="m">${esc(g.detail)}</span></div>`}).join(""):'<div class="card m">No games scheduled in this league right now.</div>';
   const age=Date.now()-Date.parse(r.meta.fetchedAt);
   $("#ts").textContent=r.static?`Source: ESPN scoreboard snapshot collected by GitHub Actions at ${new Date(r.meta.fetchedAt).toLocaleString()}${r.fallback?" (local API unavailable, using fallback)":""}. Snapshots refresh about every 15 min and can lag; this is not real-time. Status when collected: ${r.meta.status}.${age>36e5?" WARNING: this snapshot is over 1 hour old.":""}`:`Source: ESPN public scoreboard via local API (unofficial). Status: ${r.meta.status}. Fetched ${new Date(r.meta.fetchedAt).toLocaleTimeString()} (${r.meta.cache}).${r.meta.stale?" STALE: provider failed, showing last good data.":""}${r.meta.status==="live"?" Auto-refreshing every 20s.":""}`;
   if(r.static)delay=300e3;else if(r.meta.status==="live")delay=20e3;first=false;
  }catch(x){$("#gm").innerHTML=`<div class="err">Could not load scores: ${esc(x.message)}.</div>`;delay=60e3}
  liveTimer=setTimeout(load,delay)};
 load();
}

/* ---------- PLAYER RESEARCH ---------- */
const EXTRA={soccer:["Soccer",[["FotMob","https://www.fotmob.com/search?q="],["Sofascore","https://www.sofascore.com/search?q="]]],
 tennis:["Tennis",[["Sofascore","https://www.sofascore.com/search?q="]]]};
const S={sport:"all",ps:"mlb",player:null,data:null,stat:null,thr:null,n:10,err:null,loading:false};
function research(){
 $("#app").innerHTML=`<div class="view"><div class="card"><div class="bar">
 <select id="sp"><option value="all" ${S.sport==="all"?"selected":""}>All sports</option>${Object.entries(P).map(([k,v])=>`<option value="${k}" ${k===S.sport?"selected":""}>${v.label}</option>`).join("")}${Object.entries(EXTRA).map(([k,v])=>`<option value="${k}" ${k===S.sport?"selected":""}>${v[0]} (links only)</option>`).join("")}</select>
 <input id="q" placeholder="Search any player (e.g. Aaron Judge, Connor McDavid)" style="flex:1;min-width:200px" aria-label="Search player"></div>
 <div id="hits"></div><p class="m" style="margin:8px 0 0">${EXTRA[S.sport]?`${EXTRA[S.sport][0]} player stats are not built into this app yet. Search opens outside sites.`:S.sport==="all"?"All sports searches every league with player data (MLB, NHL, NBA, WNBA, NFL, NCAA). Soccer and Tennis are links only for now.":""}</p></div><div id="out"></div></div>`;
 $("#sp").onchange=e=>{S.sport=e.target.value;S.player=null;S.data=null;research()};
 let t;$("#q").oninput=e=>{clearTimeout(t);const q=e.target.value.trim();if(q.length<3){$("#hits").innerHTML="";return}
  t=setTimeout(async()=>{if(EXTRA[S.sport]){$("#hits").onclick=null;$("#hits").innerHTML=`<div class="res">${EXTRA[S.sport][1].map(([l,u])=>`<a class="chip" target="_blank" rel="noopener" href="${u}${encodeURIComponent(q)}">Search "${esc(q)}" on ${l} ↗</a>`).join("")}</div>`;return}
  try{const r=await searchAll(q);
   $("#hits").innerHTML=r.length?r.map((p,i)=>`<div class="hit" tabindex="0" data-i="${i}"><span>${esc(p.name)}</span><span class="m">${esc(P[p.sport].label)} · ${esc(p.pos)} ${esc(p.team)}</span></div>`).join(""):'<p class="m">No matches.</p>';
   $("#hits").onclick=$("#hits").onkeydown=ev=>{if(ev.type==="keydown"&&ev.key!=="Enter")return;const h=ev.target.closest(".hit");if(h)pick(r[h.dataset.i])}
  }catch(x){$("#hits").innerHTML=`<div class="err">Search failed: ${esc(x.message)}</div>`}},300)};
 render();
}
async function searchAll(q){const ks=S.sport==="all"?Object.keys(P):[S.sport];
 const rs=await Promise.allSettled(ks.map(k=>P[k].search(q).then(r=>r.map(p=>({...p,sport:k})))));
 const ok=rs.filter(r=>r.status==="fulfilled").flatMap(r=>r.value);
 if(!ok.length&&rs.every(r=>r.status==="rejected"))throw rs[0].reason;return ok}
async function pick(p){S.ps=p.sport||S.sport;S.player=p;S.loading=true;S.err=null;S.data=null;$("#hits").innerHTML="";render();
 try{const d=await P[S.ps].logs(p);d.games=d.games.filter(g=>g.date);S.data=d;S.stat=Object.keys(d.stats)[0];S.thr=null;
  if(!d.games.length)S.err=`No ${SEASON} game log returned for ${p.name}.`}catch(x){S.err="Game log failed: "+x.message}
 S.loading=false;render()}
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function render(){const o=$("#out");if(!o)return;
 if(S.loading){o.innerHTML='<div class="sk"></div>';return}
 if(S.err){o.innerHTML=`<div class="err">${esc(S.err)}</div>`;return}
 if(!S.data){o.innerHTML='<div class="card m">Pick a sport, search a player, then set a threshold. All numbers come from the real game log.</div>';return}
 const d=S.data,f=d.stats[S.stat];
 const all=d.games.map(g=>({...g,v:+f(g.raw)})).filter(g=>Number.isFinite(g.v));
 const w=all.slice(-S.n),vals=w.map(g=>g.v),sa=mean(all.map(g=>g.v));
 if(S.thr==null)S.thr=Math.round(sa*2)/2+.5-(Number.isInteger(Math.round(sa*2)/2)?0:0);
 const ov=vals.filter(v=>v>S.thr).length,un=vals.filter(v=>v<S.thr).length;
 const h=all.filter(g=>g.home),a=all.filter(g=>!g.home);
 const fav=store.get("fav",[]).some(x=>x.sport===S.ps&&x.id===S.player.id);
 o.innerHTML=`<div class="card"><div class="bar"><h2 style="margin:0;flex:1">${esc(S.player.name)} <span class="m" style="font-size:14px">${esc(S.player.pos)} ${esc(S.player.team)} · ${SEASON} season · ${all.length} games</span></h2>
 <button class="chip" id="fv">${fav?"★ Saved":"☆ Save"}</button>
 ${[["FotMob","https://www.fotmob.com/search?q="],["Sofascore","https://www.sofascore.com/search?q="],["StatMuse","https://www.statmuse.com/ask?q="],...(S.ps==="nba"?[["RealGM","https://basketball.realgm.com/search?q="]]:[])].map(([l,u])=>`<a class="chip" target="_blank" rel="noopener" href="${u}${encodeURIComponent(S.player.name)}">${l} ↗</a>`).join("")}</div>
 <div class="bar"><select id="st">${Object.keys(d.stats).map(k=>`<option ${k===S.stat?"selected":""}>${esc(k)}</option>`).join("")}</select>
 <label class="m">Threshold <input id="th" type="number" step="0.5" value="${S.thr}" style="width:90px"></label>
 ${[5,10,15,20].map(n=>`<button class="chip ${S.n===n?"on":""}" data-n="${n}">L${n}</button>`).join("")}</div>
 <div class="stats">
 <div class="stat"><div class="v g" data-c="${ov}" data-d="0">0</div><div class="l">Over ${S.thr} (last ${vals.length})</div></div>
 <div class="stat"><div class="v r" data-c="${un}" data-d="0">0</div><div class="l">Under ${S.thr}</div></div>
 <div class="stat"><div class="v" data-c="${vals.length?ov/vals.length*100:0}" data-d="0" data-s="%">0</div><div class="l">Hit rate over</div></div>
 <div class="stat"><div class="v" data-c="${mean(vals)}" data-d="2">0</div><div class="l">L${S.n} average</div></div>
 <div class="stat"><div class="v" data-c="${sa}" data-d="2">0</div><div class="l">Season average</div></div>
 <div class="stat"><div class="v" data-c="${mean(h.map(g=>g.v))}" data-d="2">0</div><div class="l">Home avg (${h.length})</div></div>
 <div class="stat"><div class="v" data-c="${mean(a.map(g=>g.v))}" data-d="2">0</div><div class="l">Away avg (${a.length})</div></div></div>
 ${chart(w,S.thr,sa)}
 <div class="res" style="margin-top:12px">${w.slice().reverse().map((g,i)=>`<span class="pill ${g.v>S.thr?"o":g.v<S.thr?"u":""}" style="animation-delay:${i*25}ms" title="${esc(g.date)} vs ${esc(g.opp)}">${+g.v.toFixed(2)}</span>`).join("")}</div>
 <p class="m">Newest first. Green = over threshold, red = under, grey = push. Actual historical data from ${esc(P[S.ps].src)}, fetched ${stamp()}. No projections are generated.</p>
 <details><summary>Game log</summary><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">${all.slice().reverse().map(g=>`<tr><td class="m">${esc(g.date)}</td><td>${g.home?"vs":"@"} ${esc(g.opp)}</td><td><b>${+g.v.toFixed(2)}</b></td></tr>`).join("")}</table></div></details></div>`;
 $("#st").onchange=e=>{S.stat=e.target.value;S.thr=null;render()};
 $("#th").onchange=e=>{S.thr=+e.target.value;render()};
 o.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{S.n=+b.dataset.n;render()});
 $("#fv").onclick=()=>{let f=store.get("fav",[]);const i=f.findIndex(x=>x.sport===S.ps&&x.id===S.player.id);i>=0?f.splice(i,1):f.push({...S.player,sport:S.ps});store.set("fav",f);render()};
 o.querySelectorAll("[data-c]").forEach(el=>count(el));
}
function count(el){const to=+el.dataset.c,dp=+el.dataset.d,sf=el.dataset.s||"",t0=performance.now();
 const step=t=>{const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent=(to*e).toFixed(dp)+sf;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function chart(w,thr,sa){
 if(!w.length)return'<p class="m">No games to chart.</p>';
 const W=800,H=260,pl=36,pb=24,pt=18,mx=Math.max(...w.map(g=>g.v),thr,sa)*1.15||1;
 const slot=(W-pl-10)/w.length,bw=Math.min(44,slot*.68),Y=v=>pt+(H-pt-pb)*(1-v/mx),X=i=>pl+slot*i+(slot-bw)/2,base=Y(0);
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Game by game bar chart">
 ${[0,.25,.5,.75,1].map(k=>`<line x1="${pl}" x2="${W-10}" y1="${Y(mx*k)}" y2="${Y(mx*k)}" stroke="#26262f"/><text x="4" y="${Y(mx*k)+4}">${(mx*k).toFixed(0)}</text>`).join("")}
 ${w.map((g,i)=>{const c=g.v>thr?"#3ddc97":g.v<thr?"#ff5d6c":"#9a9aa8",h=Math.max(1,base-Y(g.v));
  return`<g><rect class="bx" style="animation-delay:${i*35}ms" x="${X(i)}" y="${base-h}" width="${bw}" height="${h}" rx="4" fill="${c}" fill-opacity=".85"><title>${esc(g.date)} ${g.home?"vs":"@"} ${esc(g.opp)}: ${+g.v.toFixed(2)}</title></rect>
  ${w.length<=15?`<text class="dot" style="animation-delay:${400+i*35}ms;fill:#ececf1" x="${X(i)+bw/2}" y="${base-h-5}" text-anchor="middle">${+g.v.toFixed(1)}</text>`:""}</g>`}).join("")}
 <line x1="${pl}" x2="${W-10}" y1="${Y(sa)}" y2="${Y(sa)}" stroke="#6c8cff" stroke-opacity=".7"/>
 <line x1="${pl}" x2="${W-10}" y1="${Y(thr)}" y2="${Y(thr)}" stroke="#ffc857" stroke-dasharray="5 4"/><text x="${W-62}" y="${Y(thr)-5}" style="fill:#ffc857">line ${thr}</text>
 <text x="${pl}" y="${H-6}">oldest</text><text x="${W-50}" y="${H-6}">newest</text></svg>

 $("#app").innerHTML=`<div class="view">${f.length?f.map((p,i)=>`<div class="card hit" data-i="${i}"><span>${esc(p.name)}</span><span class="m">${esc(P[p.sport]?.label)} · ${esc(p.pos)} ${esc(p.team)}</span></div>`).join(""):'<div class="card m">No favorites yet. Save a player from Player Research.</div>'}</div>`;
 $("#app").onclick=e=>{const h=e.target.closest("[data-i]");if(h&&f[h.dataset.i]){go("research");pick(f[h.dataset.i])}}}

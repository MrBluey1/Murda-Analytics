name: collect-sports-data

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [full, fast]
        default: full
  push:
    branches: [main]
    paths: ["tracked.json"]

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore previous data (data branch)
        uses: actions/checkout@v4
        with:
          ref: data
          path: out
        continue-on-error: true

      - name: Prepare data directory
        run: |
          if [ ! -d out/.git ]; then
            mkdir -p out
            cd out
            git init -q
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect
        env:
          OUT: out
          TRACKED: tracked.json
          MODE: ${{ github.event.inputs.mode || ((github.event.schedule == '17 * * * *' || github.event_name == 'push') && 'full') || 'fast' }}
        run: node collect.js

      - name: Persist snapshot (single squashed commit on data branch)
        working-directory: out
        run: |
          git config user.name "sports-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan snapshot
          git add -A
          git commit -q -m "snapshot $(date -u +%FT%TZ)"
          git push -q --force origin snapshot:data

      - name: Build Pages artifact
        run: |
          mkdir site
          rsync -a --exclude=.git out/ site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
        id: deploy

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Murda Analytics</title>
<meta name="description" content="Murda Analytics: multi-sport player research, game box scores, head-to-head history, career statistics and locally calculated model estimates.">
<meta name="theme-color" content="#0a0a0c"><meta property="og:title" content="Murda Analytics">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0c'/%3E%3Cpath d='M6 24V8l10 10L26 8v16' fill='none' stroke='%233ddc97' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0a0a0c;--p:#131318;--p2:#1a1a21;--b:#26262f;--t:#ececf1;--m:#9a9aa8;--g:#3ddc97;--r:#ff5d6c;--a:#6c8cff}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 30% at 20% 10%,#6c8cff22,transparent),radial-gradient(35% 30% at 85% 80%,#3ddc9718,transparent);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.08)}}
header{display:flex;gap:8px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--b);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;background:#0a0a0ccc;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2em;font-size:13px;margin-right:18px}.logo b{font-weight:500;color:var(--g)}.logo .mark{width:28px;height:28px}
footer{max-width:1100px;margin:0 auto;padding:0 20px 40px;color:var(--m);font-size:12px}footer b{color:var(--t);letter-spacing:.14em}
nav button,.chip{background:none;border:1px solid transparent;color:var(--m);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit;transition:.2s}
nav button:hover,.chip{text-decoration:none;font-size:13px}.chip:hover{color:var(--t);background:var(--p2)}
nav button.on,.chip.on{color:var(--t);background:var(--p2);border-color:var(--b)}
main{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
.view{animation:in .4s cubic-bezier(.2,.7,.2,1)}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card{background:linear-gradient(180deg,var(--p),#101015);border:1px solid var(--b);border-radius:16px;padding:18px;margin-bottom:16px;transition:border-color .2s,transform .2s}
.card:hover{border-color:#3a3a48}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.game{display:flex;flex-direction:column;gap:4px}.game .row{display:flex;justify-content:space-between}
.live{color:var(--r);font-size:12px;font-weight:700}.m{color:var(--m);font-size:13px}
input,select{background:var(--p2);border:1px solid var(--b);color:var(--t);padding:9px 12px;border-radius:10px;font:inherit;outline:none}
input:focus,select:focus,button:focus-visible{border-color:var(--a);outline:2px solid #6c8cff55}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--p2);border-radius:12px;padding:12px}.stat .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.stat .l{color:var(--m);font-size:12px}
.g{color:var(--g)}.r{color:var(--r)}
.res{display:flex;gap:6px;flex-wrap:wrap}.pill{padding:3px 9px;border-radius:8px;font-size:13px;font-variant-numeric:tabular-nums;animation:in .4s backwards}
.pill.o{background:#3ddc9722;color:var(--g)}.pill.u{background:#ff5d6c22;color:var(--r)}
.hit{padding:9px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between}.hit:hover{background:var(--p2)}
svg text{fill:var(--m);font-size:11px}
.path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}
.bx{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) backwards}@keyframes grow{from{transform:scaleY(0)}}.bx:hover{fill-opacity:1;filter:brightness(1.2)}
.dot{opacity:0;animation:in .4s forwards}.dot:hover{r:7}
.sk{height:70px;border-radius:12px;background:linear-gradient(90deg,var(--p) 25%,var(--p2) 50%,var(--p) 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--b);position:relative;margin:18px 0 14px}
.tab{background:none;border:0;color:var(--m);padding:10px 18px;cursor:pointer;font:inherit;transition:color .2s}.tab:hover,.tab.on{color:var(--t)}
.ink{position:absolute;bottom:-1px;height:2px;background:var(--g);border-radius:2px;transition:left .3s cubic-bezier(.2,.8,.2,1),width .3s cubic-bezier(.2,.8,.2,1)}
.pane{animation:in .35s cubic-bezier(.2,.7,.2,1)}
.scroll{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.st th{color:var(--m);font-weight:600;font-size:12px}table.st th,table.st td{padding:7px 8px;text-align:right;white-space:nowrap}
table.st th:first-child,table.st td:first-child{text-align:left;width:auto}table.st th:not(:first-child),table.st td:not(:first-child){width:1%;padding-left:16px}table.st tbody tr{border-top:1px solid #1d1d25;transition:background .15s}table.st tbody tr:hover{background:var(--p2)}
.gh{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.team{display:flex;flex-direction:column;align-items:center;gap:6px}.team img{width:56px;height:56px;object-fit:contain}
.big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.logo-s{width:20px;height:20px;object-fit:contain;margin-right:8px;vertical-align:middle}
.ph{display:inline-block;width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--p2);margin-right:10px;flex:none}
.hit .l{display:flex;align-items:center}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--b);border-top-color:var(--g);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
.cmp{display:grid;grid-template-columns:1fr 1.6fr 1fr;align-items:center;padding:8px 4px;border-bottom:1px solid #1d1d25;font-variant-numeric:tabular-nums;transition:background .15s}.cmp:hover{background:var(--p2)}
.cmp .lb{text-align:center;color:var(--m);font-size:13px}.cmp .v{font-weight:600}.cmp .v:last-child{text-align:right}
.na{color:var(--m);font-style:italic}
.game{cursor:pointer}.game:hover{transform:translateY(-2px)}
.t2{display:flex;gap:4px;margin:12px 0}.t2 .tab{padding:7px 14px;border-radius:999px;border:1px solid transparent}.t2 .tab.on{background:var(--p2);border-color:var(--b)}
.stat.acc{border:1px solid #6c8cff66;background:#6c8cff12}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pick{margin:0;display:flex;flex-direction:column;gap:8px}.pk-h{display:flex;align-items:center}.pk-h .ph{width:44px;height:44px}
.pk-l{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.pk-l .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px}.dots i{width:14px;height:14px;border-radius:4px;background:var(--b)}.dots i.o{background:var(--g)}.dots i.u{background:var(--r)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--p2);border:1px solid var(--b);color:var(--m);margin:0 4px 4px 0}
.tag.hot{color:var(--g);border-color:#3ddc9755}
.err{color:var(--r);background:#ff5d6c14;border:1px solid #ff5d6c40;padding:10px 14px;border-radius:10px}
details summary{cursor:pointer;color:var(--m)}
@media(max-width:640px){header{padding:10px 12px}.logo{margin-right:6px;letter-spacing:.12em}.logo span{display:none}.big{font-size:34px}.pgrid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.path{stroke-dashoffset:0}.dot{opacity:1}}
</style></head><body>
<header><div class="logo" aria-label="Murda Analytics"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#131318" stroke="#26262f"/><path d="M7 23V9l9 9 9-9v14" fill="none" stroke="#3ddc97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>MURDA <b>ANALYTICS</b></span></div>
<nav id="nav"><button data-v="live" class="on">Live Games</button><button data-v="research">Player Research</button><button data-v="fav">Favorites</button><button data-v="src">Sources</button></nav></header>
<main id="app"></main>
<footer><b>MURDA ANALYTICS</b> · Statistics come from free public sources and can be delayed or incomplete; model estimates are not guarantees. Times are shown in your time zone (<span id="tzn"></span>). See Sources for licenses.</footer>
<script>
const $=(s,e=document)=>e.querySelector(s);
const PROXY=location.protocol.startsWith("http")&&["localhost","127.0.0.1"].includes(location.hostname);
const J=async(u)=>{let r;try{r=await fetch(PROXY?"/proxy?u="+encodeURIComponent(u):u)}catch(e){throw new Error(PROXY?"network blocked or offline":"browser blocked the request; start the local server with: node server.js")}
 if(!r.ok)throw new Error(r.status+" from "+new URL(u).hostname);return r.json()};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const stamp=()=>new Date().toLocaleTimeString();
const TZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone}catch{return"local"}})();
/* Dates: the provider's UTC instant is the source of truth and is rendered in the viewer's time zone. Date-only values (MLB/NHL) are shown as-is, never shifted. */
function fmtD(g){if(g&&g.startTime){const d=new Date(g.startTime);if(!isNaN(d))return d.toLocaleDateString(undefined,{year:"numeric",month:"numeric",day:"numeric"})}
 const m=String((g&&g.date)||"").match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString(undefined,{year:"numeric",month:"numeric",day:"numeric"}):(g&&g.date)||""}
const fmtDT=iso=>{const d=new Date(iso);return isNaN(d)?"":d.toLocaleString(undefined,{weekday:"short",month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"})};
const fmtP=v=>v==null?"n/a":(v>0?"+"+v:String(v));
const ip=s=>{const[a,b]=String(s||"0").split(".");return +a+(+b||0)/3};

/* ---------- PROVIDERS (player data) ---------- */
const SEASON=new Date().getFullYear()-(new Date().getMonth()<2?1:0);
const P={
 mlb:{label:"MLB",src:"MLB Stats API (statsapi.mlb.com)",
  async search(q){const d=await J("https://statsapi.mlb.com/api/v1/people/search?names="+encodeURIComponent(q));
   return (d.people||[]).slice(0,8).map(p=>({id:p.id,name:p.fullName,team:p.currentTeam?.name||"",pos:p.primaryPosition?.abbreviation||""}))},
  async logs(p){const g=p.pos==="P"?"pitching":"hitting";
   const d=await J(`https://statsapi.mlb.com/api/v1/people/${p.id}/stats?stats=gameLog&group=${g}&season=${SEASON}`);
   const s=d.stats?.[0]?.splits||[];
   const stats=g==="pitching"?{Strikeouts:x=>x.strikeOuts,"Innings":x=>ip(x.inningsPitched),"Earned Runs":x=>x.earnedRuns,"Hits Allowed":x=>x.hits,Walks:x=>x.baseOnBalls}
    :{Hits:x=>x.hits,"Home Runs":x=>x.homeRuns,Runs:x=>x.runs,RBIs:x=>x.rbi,"Total Bases":x=>x.totalBases,"Stolen Bases":x=>x.stolenBases,Strikeouts:x=>x.strikeOuts};
   return{stats,games:s.map(x=>({date:x.date,opp:x.opponent?.name||"?",home:!!x.isHome,raw:x.stat}))}}},
 nhl:{label:"NHL",src:"NHL Web API (api-web.nhle.com)",
  async search(q){const d=await J("https://search.d3.nhle.com/api/v1/search/player?culture=en-us&limit=8&q="+encodeURIComponent(q));
   return d.map(p=>({id:p.playerId,name:p.name,team:p.teamAbbrev||"",pos:p.positionCode||""}))},
  async logs(p){const d=await J(`https://api-web.nhle.com/v1/player/${p.id}/game-log/now`);
   const stats=p.pos==="G"?{Saves:x=>x.shotsAgainst-x.goalsAgainst,"Shots Against":x=>x.shotsAgainst,"Goals Against":x=>x.goalsAgainst}
    :{Goals:x=>x.goals,Assists:x=>x.assists,Points:x=>x.points,"Shots on Goal":x=>x.shots};
   return{stats,games:(d.gameLog||[]).slice().reverse().map(x=>({date:x.gameDate,opp:x.opponentAbbrev,home:x.homeRoadFlag==="H",raw:x}))}}}
};


const STATIC_BASE = (() => {
  try {
    const q = new URLSearchParams(location.search).get("data");

    if (q) localStorage.setItem("dataBase", q);

    return (
      q ||
      localStorage.getItem("dataBase") ||
      "https://mrbluey1.github.io/Murda-Analytics"
    ).replace(/\/+$/, "");
  } catch {
    return "https://mrbluey1.github.io/Murda-Analytics";
  }
})();

const staticUrl = u => {
  let m;

  if (m = u.match(/^\/api\/(\w+)\/scoreboard/))
    return `${STATIC_BASE}/scoreboard/${m[1]}.json`;

  if (m = u.match(/^\/api\/(\w+)\/players\?/))
    return `${STATIC_BASE}/players/${m[1]}/index.json`;

  if (m = u.match(/^\/api\/(\w+)\/players\/([^/]+)\/gamelog/))
    return `${STATIC_BASE}/players/${m[1]}/${m[2]}.json`;

  return null;
};

/* Data access: live local API first; falls back to GitHub Pages snapshots when the local server is unavailable. */
const A=async u=>{let err;
 if(PROXY){try{const r=await fetch(u),d=await r.json().catch(()=>({}));if(d.ok)return d;err=new Error(d.error||"API error "+r.status)}catch(e){err=e}}
 const su=STATIC_BASE&&staticUrl(u);
 if(!su)throw err||new Error("no data source: run node server.js (open http://localhost:8787) or add ?data=https://USER.github.io/REPO to the address once");
 let r;try{r=await fetch(su+"?t="+Math.floor(Date.now()/60000))}catch{throw new Error("could not reach "+STATIC_BASE)}
 const d=await r.json().catch(()=>({}));
 if(r.status===404)throw new Error("not collected yet. Snapshots only include players listed in config/tracked.json");
 if(!r.ok||!d.ok)throw new Error(d.error||"snapshot error "+r.status);
 if(/players\?/.test(u)){const q=decodeURIComponent(u.split("q=")[1]||"").toLowerCase();d.data={players:d.data.players.filter(p=>fold(p.name).includes(fold(q)))}}
 return{...d,static:true,fallback:!!PROXY}};
const pretty=k=>String(k).replace(/_/g," ").replace(/([a-z])([A-Z])/g,"$1 $2").replace(/\b[a-z]/g,c=>c.toUpperCase());
const fold=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[đĐ]/g,"d").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
const FALLBACK=["nba","wnba","nfl","mlb","nhl","soccer"].map(k=>({key:k,label:k.toUpperCase(),implementation:"unknown",leagues:[],caps:{search:1,gamelog:1,h2h:1},providers:[]}));
const viaApi=(k,label)=>({label,src:"the provider listed on the Sources page (local API or GitHub snapshot)",
 async search(q){const d=await A(`/api/${k}/players?q=${encodeURIComponent(q)}`),a=d.data.players;a.dir=d.meta?.directory;return a},
 async teams(q){return (await A(`/api/${k}/teams?q=${encodeURIComponent(q)}`)).data.teams},
 async roster(t){return (await A(`/api/${k}/teams/${encodeURIComponent(t.id)}/roster${t.path?"?path="+encodeURIComponent(t.path):""}`)).data.players},
 async logs(p,season){const d=(await A(`/api/${k}/players/${encodeURIComponent(p.id)}/gamelog${season?"?season="+encodeURIComponent(season):""}`)).data,stats={},keys={};
  d.statKeys.forEach(key=>{stats[pretty(key)]=x=>x[key];keys[pretty(key)]=key});
  return{stats,keys,note:d.note,linked:d.linked||null,games:d.games.map(g=>({date:g.date,startTime:g.startTime,dateOnly:g.dateOnly,label:g.label,opp:g.opponent,home:g.home,raw:g.stats,dnp:g.dnp,result:g.result}))}}});
let REG=null;
const regReady=(async()=>{try{if(PROXY)REG=(await(await fetch("/api/registry")).json()).data}catch{}if(!REG)REG={sports:FALLBACK,providers:[]};REG.sports.forEach(s=>{P[s.key]=viaApi(s.key,s.label)})})();
const sportMeta=k=>(REG&&REG.sports.find(s=>s.key===k))||{key:k,label:k,caps:{},leagues:[]};
const IMPL={full:"",partial:" (partial)",dataset:" (needs dataset)","info-only":" (profile only)"};
function seasonOpts(k){const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;let base;
 if(k==="nba"||k==="ncaab")base=m>=9?y+1:y;else if(k==="nhl")base=m>=9?y:y-1;else if(k==="nfl"||k==="ncaaf")base=m>=3?y:y-1;else if(k==="f1")base=m>=3?y:y-1;else if(k==="tennis")base=y;else base=m>=2?y:y-1;
 return Array.from({length:6},(_,i)=>k==="nhl"?{v:`${base-i}${base-i+1}`,l:`${base-i}-${base-i+1}`}:{v:String(base-i),l:k==="nba"||k==="ncaab"?`${base-i-1}-${String(base-i).slice(2)}`:String(base-i)})}
const KEY={NBA:"nba",WNBA:"wnba",NFL:"nfl",MLB:"mlb",NHL:"nhl",NCAAF:"ncaaf",NCAAB:"ncaab","Premier League":"epl","La Liga":"laliga",Bundesliga:"bundesliga","Serie A":"seriea","Ligue 1":"ligue1","Saudi Pro League":"saudi",MLS:"mls","Champions League":"ucl"};

/* ---------- LIVE SCORES (ESPN public endpoints, unofficial) ---------- */
const LEAGUES={NBA:"basketball/nba",WNBA:"basketball/wnba",NFL:"football/nfl",MLB:"baseball/mlb",NHL:"hockey/nhl","NCAAF":"football/college-football","NCAAB":"basketball/mens-college-basketball","Premier League":"soccer/eng.1","La Liga":"soccer/esp.1",Bundesliga:"soccer/ger.1","Serie A":"soccer/ita.1","Ligue 1":"soccer/fra.1","Saudi Pro League":"soccer/ksa.1",MLS:"soccer/usa.1","Champions League":"soccer/uefa.champions"};
let lg="NBA",liveTimer,gameTimer;
async function live(){
 clearTimeout(liveTimer);
 $("#app").innerHTML=`<div class="view"><div class="bar" id="lgs">${Object.keys(LEAGUES).map(k=>`<button class="chip ${k===lg?"on":""}" data-l="${k}">${k}</button>`).join("")}</div><div id="gm" class="grid">${'<div class="sk"></div>'.repeat(6)}</div><p class="m" id="ts"></p><p class="m">Click any game for its team and player statistics.</p></div>`;
 $("#lgs").onclick=e=>{if(e.target.dataset.l){lg=e.target.dataset.l;live()}};
 $("#gm").onclick=$("#gm").onkeydown=ev=>{if(ev.type==="keydown"&&ev.key!=="Enter")return;const c=ev.target.closest("[data-id]");if(c)game(KEY[lg],c.dataset.id)};
 let first=true;
 const load=async()=>{
  if(!$("#gm"))return;
  if(document.hidden){liveTimer=setTimeout(load,30e3);return}
  let delay=60e3;
  try{const r=await A(`/api/${KEY[lg]}/scoreboard`),gs=r.data.games;
   $("#gm").innerHTML=gs.length?gs.map((g,i)=>{const row=t=>`<div class="row"><span>${t?.logo?`<img class="logo-s" src="${esc(t.logo)}" alt="" loading="lazy" onerror="this.style.display='none'">`:""}${esc(t?.name)}</span><b>${g.state==="scheduled"?"":esc(t?.score)}</b></div>`;
    return`<div class="card game" data-id="${esc(g.id)}" tabindex="0" role="button" aria-label="Open game details" ${first?`style="animation:in .4s ${i*40}ms backwards"`:'style="animation:none"'}>${g.state==="live"?'<span class="live">● LIVE</span>':""}${row(g.away)}${row(g.home)}<span class="m">${esc(g.state==="scheduled"&&g.startTime?fmtDT(g.startTime):g.detail)}</span></div>`}).join(""):'<div class="card m">No games scheduled in this league right now.</div>';
   const age=Date.now()-Date.parse(r.meta.fetchedAt);
   $("#ts").textContent=r.static?`Source: ESPN scoreboard snapshot collected by GitHub Actions at ${new Date(r.meta.fetchedAt).toLocaleString()}${r.fallback?" (local API unavailable, using fallback)":""}. Snapshots refresh about every 15 min and can lag; this is not real-time. Status when collected: ${r.meta.status}.${age>36e5?" WARNING: this snapshot is over 1 hour old.":""}`:`Source: ESPN public scoreboard via local API (unofficial). Status: ${r.meta.status}. Fetched ${new Date(r.meta.fetchedAt).toLocaleTimeString()} (${r.meta.cache}).${r.meta.stale?" STALE: provider failed, showing last good data.":""}${r.meta.status==="live"?" Auto-refreshing every 20s.":""}`;
   if(r.static)delay=300e3;else if(r.meta.status==="live")delay=20e3;first=false;
  }catch(x){$("#gm").innerHTML=`<div class="err">Could not load scores: ${esc(x.message)}.</div>`;delay=60e3}
  liveTimer=setTimeout(load,delay)};
 load();
}

/* ---------- GAME DETAILS ---------- */
async function game(key,id){
 clearTimeout(liveTimer);clearTimeout(gameTimer);

 let QT=null,QTE="";

 const tbl=g=>{const aS=g.rows.some(r=>r.starter),qs=(G.quarterPoints&&G.quarterPoints.verified&&G.periods&&G.periods.available)?G.periods.labels:[],n=g.columns.length+qs.length;

 $("#tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;tab=b.dataset.t;document.querySelectorAll(".tab").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-selected",String(x===b))});ink();pane(true)};
 ink();
 if(!PROXY){$("#gh").innerHTML='';$("#gp").innerHTML='<div class="err">Game details need the local server. Run node server.js and open http://localhost:8787. GitHub snapshots only contain scoreboards.</div>';return}
 const load=async()=>{

  let delay=60e3;
  try{const r=await A(`/api/${key}/games/${encodeURIComponent(id)}`);G=r.data;head();pane(first);first=false;
   $("#gts").textContent=`Source: ESPN game summary via local API (unofficial). Status: ${G.status.state}. Fetched ${new Date(r.meta.fetchedAt).toLocaleTimeString()} (${r.meta.cache}).${r.meta.stale?" STALE: provider failed, showing last good data.":""}${G.status.state==="live"?" Refreshes every 20s; how fresh the stats are depends on ESPN.":""}`;
   delay=G.status.state==="live"?20e3:G.status.state==="completed"?0:60e3;
  }catch(x){if(!G){$("#gh").innerHTML="";$("#gp").innerHTML=`<div class="err">Could not load this game: ${esc(x.message)}</div>`}else $("#gts").textContent+=` Refresh failed: ${x.message}`}

 await regReady;
 const sp=S.sport==="all"?null:sportMeta(S.sport),leagues=sp?sp.leagues||[]:[];
 const note=!sp?"Search runs across every sport at once: current rosters (NBA, WNBA, NFL, MLB, NHL, soccer), F1 drivers, tennis players, any imported datasets and profile-only sports. NCAA is searched when you pick it.":`${esc(sp.note||"")}${sp.implementation==="dataset"?" Import the dataset first (see README).":""}`;

 ${leagues.length?`<select id="lgsel" aria-label="League"><option value="">All leagues</option>${leagues.map(l=>`<option ${l===S.league?"selected":""}>${esc(l)}</option>`).join("")}</select>`:""}
 <input id="q" placeholder="Search any athlete (e.g. Lionel Messi, Patrick Mahomes, Max Verstappen)" style="flex:1;min-width:200px" aria-label="Search athlete"></div>

 $("#sp").onchange=e=>{S.sport=e.target.value;S.league="";S.player=null;S.data=null;research()};
 if($("#lgsel"))$("#lgsel").onchange=e=>{S.league=e.target.value};
 let t,tok=0;$("#q").oninput=e=>{clearTimeout(t);const q=e.target.value.trim();if(q.length<2){tok++;$("#hits").innerHTML="";return}
  t=setTimeout(async()=>{const my=++tok;
  $("#hits").innerHTML='<p class="m"><span class="spin"></span>Searching…</p>';
  try{const [r,tm]=await Promise.all([searchAll(q),searchTeams(q)]);if(my!==tok)return;
   const img=(u,rd)=>u?`<img class="ph" ${rd?'style="border-radius:8px;object-fit:contain"':""} src="${esc(u)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`:'<span class="ph"></span>';
   const bad=(r.providers||[]).filter(x=>!x.ok).map(x=>sportMeta(x.key).label);
   $("#hits").innerHTML=r.map((p,i)=>{const sm=sportMeta(p.sport);return`<div class="hit" tabindex="0" data-i="${i}"><span class="l">${img(p.photo)}<span><b>${esc(p.name)}</b>${p.info?' <span class="tag">profile only</span>':""}<br><span class="m">${esc(p.pos||"")}${p.pos&&p.team?" · ":""}${esc(p.team||"")}</span></span></span><span class="m" style="text-align:right">${esc(p.league||sm.label)}${p.league&&p.league!==sm.label?`<br>${esc(sm.label)}`:""}</span></div>`}).join("")
    +(tm.length?`<p class="m" style="margin:10px 0 2px">Teams</p>`+tm.map((x,i)=>`<div class="hit" tabindex="0" data-t="${i}"><span class="l">${img(x.logo,1)}<b>${esc(x.name)}</b></span><span class="m">${esc(x.league)}</span></div>`).join(""):"")
    +(!r.length&&!tm.length?`<p class="m">No athlete or team matches "${esc(q)}". Check the spelling or pick a specific sport. Rosters list current players only; tennis and F1 include historical athletes.</p>`:"")
    +(r.loading&&r.loading.length?`<p class="m"><span class="spin"></span>Still building the player directory for ${esc(r.loading.map(k=>sportMeta(k).label).join(", "))}. Search again in a few seconds for complete results.</p>`:"")
    +(bad.length?`<p class="m">Some sources were unavailable and are not included: ${esc(bad.join(", "))}.</p>`:"");
   $("#hits").onclick=$("#hits").onkeydown=ev=>{if(ev.type==="keydown"&&ev.key!=="Enter")return;const h=ev.target.closest(".hit");if(!h)return;if(h.dataset.i!=null)pick(r[h.dataset.i]);else if(h.dataset.t!=null)showRoster(tm[h.dataset.t])}

const TEAM_SPORTS=["nba","wnba","nfl","mlb","nhl","soccer","ncaab","ncaaf"];
const searchKeys=()=>S.sport==="all"?Object.keys(P).filter(k=>!/^ncaa/.test(k)&&TEAM_SPORTS.includes(k)):[S.sport];
async function searchAll(q){
 if(PROXY){const qs=new URLSearchParams({q});if(S.sport!=="all")qs.set("sport",S.sport);if(S.league)qs.set("league",S.league);
  const d=await A(`/api/search?${qs}`),a=d.data.players;a.providers=d.meta.providers;a.loading=d.meta.directoriesLoading;return a}
 const rs=await Promise.allSettled(searchKeys().map(k=>P[k].search(q).then(r=>r.map(p=>({...p,sport:k})))));
 const ok=rs.filter(r=>r.status==="fulfilled").flatMap(r=>r.value);if(!ok.length&&rs.every(r=>r.status==="rejected"))throw rs[0].reason;return ok}
async function searchTeams(q){
 const ks=searchKeys().filter(k=>TEAM_SPORTS.includes(k));if(!PROXY)return[];
 const rs=await Promise.allSettled(ks.map(k=>P[k].teams(q).then(r=>r.slice(0,4).map(t=>({...t,sport:k})))));
 return rs.filter(r=>r.status==="fulfilled").flatMap(r=>r.value).slice(0,8)}
async function showRoster(t){const o=$("#out");$("#hits").innerHTML="";o.innerHTML='<div class="sk"></div>';
 try{const pl=await P[t.sport].roster(t);
  o.innerHTML=`<div class="card view"><div class="bar"><h2 style="margin:0;flex:1">${t.logo?`<img class="logo-s" style="width:32px;height:32px" src="${esc(t.logo)}" alt="" onerror="this.style.display='none'">`:""}${esc(t.name)} <span class="m" style="font-size:14px">${esc(t.league)} · ${pl.length} players</span></h2></div><div id="rost">${pl.map((p,i)=>`<div class="hit" tabindex="0" data-i="${i}"><span class="l">${p.photo?`<img class="ph" src="${esc(p.photo)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`:'<span class="ph"></span>'}<b>${esc(p.name)}</b></span><span class="m">${esc(p.pos)}${p.jersey!==""&&p.jersey!=null?" · #"+esc(p.jersey):""}</span></div>`).join("")||'<p class="m">The provider returned no roster for this team.</p>'}</div></div>`;
  $("#rost").onclick=$("#rost").onkeydown=ev=>{if(ev.type==="keydown"&&ev.key!=="Enter")return;const h=ev.target.closest(".hit");if(h)pick({...pl[h.dataset.i],sport:t.sport})}
 }catch(x){o.innerHTML=`<div class="err">Roster failed: ${esc(x.message)}</div>`}}
async function pick(p){S.ps=p.sport||S.sport;S.player=p;S.tab="ov";S.opp=null;S.h2h=null;S.profile=null;S.profErr=null;S.cmp=null;S.season="";track({...p,sport:S.ps});await loadLog(p)}
async function loadLog(p){S.loading=true;S.err=null;S.data=null;S.loadMsg=S.ps==="soccer"||S.ps==="nfl"?"Loading game history. Soccer builds it from match box scores, which can take several seconds the first time.":"";if($("#hits"))$("#hits").innerHTML="";render();
 try{const d=await P[S.ps].logs(p,S.season);d.games=d.games.filter(g=>g.date||g.startTime||g.label);S.data=d;S.keys=d.keys||{};S.stat=Object.keys(d.stats)[0];S.thr=null;
  if(!d.games.length)S.err=`No game or match history was returned for ${p.name}${S.season?" in the selected season":" this season"}. Try another season, or open the Profile tab.`}
 catch(x){S.err="Game log failed: "+x.message}
 if(S.err&&!(S.data&&S.data.games.length))S.tab="profile";
 S.loading=false;render()}
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

 {const b=$(`#ptabs [data-pt="${S.tab}"]`),k=$("#pink");if(b&&k){k.style.left=b.offsetLeft+"px";k.style.width=b.offsetWidth+"px"}}
 if(S.tab==="ov"&&S.data&&S.data.games.length)overviewPane();else if(S.tab==="h2h")h2hInit();else if(S.tab==="cmp")comparePane();else profilePane();
}
function overviewPane(){const o=$("#pbody"),d=S.data,f=d.stats[S.stat];
 const all=d.games.map(g=>({...g,v:+f(g.raw)})).filter(g=>Number.isFinite(g.v));
 if(!all.length){o.innerHTML=`<div class="card m" style="margin:0">No numeric ${esc(S.stat)} values in this game log.</div>`;return}
 const w=all.slice(-S.n),vals=w.map(g=>g.v),sa=mean(all.map(g=>g.v));
 if(S.thr==null)S.thr=Math.round(sa*2)/2+.5;
 const ov=vals.filter(v=>v>S.thr).length,un=vals.filter(v=>v<S.thr).length,h=all.filter(g=>g.home),a=all.filter(g=>!g.home),so=(sportMeta(S.ps).caps||{}).seasons?seasonOpts(S.ps):[];
 o.innerHTML=`<div class="bar"><select id="st" aria-label="Statistic">${Object.keys(d.stats).map(k=>`<option ${k===S.stat?"selected":""}>${esc(k)}</option>`).join("")}</select>
 <label class="m">Threshold <input id="th" type="number" step="0.5" value="${S.thr}" style="width:90px"></label>
 ${[5,10,15,20].map(n=>`<button class="chip ${S.n===n?"on":""}" data-n="${n}">L${n}</button>`).join("")}
 ${so.length?`<select id="ssn" aria-label="Season"><option value="">Current season</option>${so.map(x=>`<option value="${x.v}" ${x.v===S.season?"selected":""}>${esc(x.l)}</option>`).join("")}</select>`:""}</div>
 <div class="stats">

 <div class="stat"><div class="v" data-c="${sa}" data-d="2">0</div><div class="l">Season average</div></div>
 ${h.length&&a.length?`<div class="stat"><div class="v" data-c="${mean(h.map(g=>g.v))}" data-d="2">0</div><div class="l">Home avg (${h.length})</div></div><div class="stat"><div class="v" data-c="${mean(a.map(g=>g.v))}" data-d="2">0</div><div class="l">Away avg (${a.length})</div></div>`:""}</div>
 ${chart(w,S.thr,sa)}

    $("#oh").innerHTML=tm.length?`<div class="res" style="margin:6px 0">${tm.map((x,i)=>`<button class="chip" data-o="${i}">${x.logo?`<img class="logo-s" src="${esc(x.logo)}" alt="" onerror="this.style.display='none'">`:""}${esc(x.name)}${x.league&&(S.ps==="soccer"||ten)?" · "+esc(x.league):""}</button>`).join("")}</div>`:`<p class="m">No ${ten?"player":"team"} matches.</p>`;
    $("#oh").onclick=ev=>{const b=ev.target.closest("[data-o]");if(b){S.opp=tm[b.dataset.o];$("#oh").innerHTML="";$("#oq").value=S.opp.name;h2hLoad()}}}
   catch(x){$("#oh").innerHTML=`<div class="err">Search failed: ${esc(x.message)}</div>`}},250)};
 const re=()=>{S.hs=+$("#hs").value;if($("#hf")){S.hf=$("#hf").value;S.ht=$("#ht").value}if(S.opp)h2hLoad()};
 $("#hs").onchange=re;if($("#hf")){$("#hf").onchange=re;$("#ht").onchange=re}

async function h2hLoad(){const b=$("#hb");if(!b||!S.opp)return;
 b.innerHTML=`<div class="sk"></div><p class="m"><span class="spin"></span>Loading ${S.hs} season${S.hs>1?"s":""} of history${S.ps==="soccer"?" from match box scores (can take several seconds)":""}…</p>`;
 try{const q=new URLSearchParams({opponent:S.opp.id,seasons:S.hs});if(S.opp.path)q.set("path",S.opp.path);if(S.hf)q.set("from",S.hf);if(S.ht)q.set("to",S.ht);
  S.h2h=(await A(`/api/${S.ps}/players/${encodeURIComponent(S.player.id)}/h2h?${q}`)).data;h2hRender()}catch(x){if($("#hb"))$("#hb").innerHTML=`<div class="err">H2H failed: ${esc(x.message)}</div>`}}
function h2hRender(){const b=$("#hb"),d=S.h2h;if(!b||!d)return;
 if(S.ps==="tennis"){b.innerHTML=d.count?`<p class="m" style="margin:10px 0"><b>${esc(S.player.name)} vs ${esc(S.opp.name)}</b> · last ${d.seasonsChecked} seasons</p><div class="stats"><div class="stat"><div class="v">${d.wins}–${d.losses}</div><div class="l">Record (${d.count} meetings)</div></div>${Object.entries(d.bySurface).map(([k,v])=>`<div class="stat"><div class="v">${v.w}–${v.l}</div><div class="l">${esc(k)}</div></div>`).join("")}</div><div class="scroll"><table class="st"><thead><tr><th>Date</th><th>Tournament</th><th>Surface · round</th><th>Result</th></tr></thead><tbody>${d.games.slice().reverse().map(g=>`<tr><td>${esc(fmtD(g))}</td><td>${esc(g.seasonType||"")}</td><td>${esc(g.competition||"")}</td><td><b>${esc(g.result)}</b></td></tr>`).join("")}</tbody></table></div><p class="m">${esc(d.note)}</p>`:`<div class="card m" style="margin:0">No meetings with ${esc(S.opp.name)} in the last ${d.seasonsChecked} seasons of the dataset.</div>`;return}
 const o=d.opponent;
 const head=`<p class="m" style="margin:10px 0">${o.logo?`<img class="logo-s" src="${esc(o.logo)}" alt="" onerror="this.style.display='none'">`:""}<b>${esc(S.player.name)} vs ${esc(o.name)}</b> · seasons checked: ${esc(d.seasonsChecked.join(", "))}</p>`;
 const fails=d.failedSeasons.length?`<div class="err" style="margin:8px 0">Could not load: ${d.failedSeasons.map(f=>esc(f.season+" ("+f.error+")")).join("; ")}. Results may be incomplete.</div>`:"";
 if(!d.count){b.innerHTML=head+`<div class="card m" style="margin:0">No meetings with ${esc(o.name)} were found in the data for the seasons and dates selected. Try more seasons or clear the date range.${S.ps==="soccer"?" Soccer H2H only covers meetings in this player's current league.":""}</div>`+fails+`<p class="m">${esc(d.note)}</p>`;return}
 const key=d.statKeys.includes(S.hk)?S.hk:(d.statKeys.find(k=>pretty(k)===S.stat)||d.statKeys[0]),fmt=v=>v==null?"n/a":(+v).toFixed(2);
 const av=d.averages[key],r3=d.recent3[key],bl=d.baseline?d.baseline[key]:null;
 const w=d.games.map(g=>({...g,opp:g.opponent,v:+g.stats[key]})).filter(g=>Number.isFinite(g.v)),same=pretty(key)===S.stat&&S.thr!=null,thr=same?S.thr:Math.round(av*2)/2;
 const bb=["nba","wnba","ncaab"].includes(S.ps),cols=bb?[["points","PTS"],["totalRebounds","REB"],["assists","AST"],["threePointFieldGoalsMade","3PM"],["steals","STL"],["blocks","BLK"],["turnovers","TO"],["minutes","MIN"],["PRA","PRA"]]:S.ps==="soccer"?[["totalGoals","G"],["goalAssists","A"],["totalShots","SH"],["shotsOnTarget","SOT"],["minutesPlayed","MIN"]]:d.statKeys.slice(0,8).map(k=>[k,pretty(k)]);
 const have=cols.filter(([k])=>d.statKeys.includes(k)),miss=cols.filter(([k])=>!d.statKeys.includes(k)).map(c=>c[1]);
 b.innerHTML=head+`<div class="bar"><label class="m">Stat <select id="hk">${d.statKeys.map(k=>`<option value="${esc(k)}" ${k===key?"selected":""}>${esc(pretty(k))}</option>`).join("")}</select></label></div>
 <div class="stats"><div class="stat"><div class="v">${d.count}</div><div class="l">Meetings</div></div>
 <div class="stat acc"><div class="v">${fmt(r3)}</div><div class="l">Last 3 meetings avg</div></div>
 <div class="stat"><div class="v">${fmt(av)}</div><div class="l">All meetings avg</div></div>
 ${bl!=null?`<div class="stat"><div class="v">${fmt(bl)}</div><div class="l">Overall avg (${d.baselineGames} games)</div></div><div class="stat"><div class="v ${av-bl>=0?"g":"r"}">${(av-bl>=0?"+":"")+(av-bl).toFixed(2)}</div><div class="l">H2H vs overall</div></div>`:""}</div>
 ${chart(w,thr,av,Math.min(3,w.length),"all-meetings average")}<p class="m" style="margin:2px 0 10px">Outlined bars = the 3 most recent meetings. Threshold ${thr}${same?" (from your Overview tab)":" (rounded H2H average)"}: over in ${w.filter(g=>g.v>thr).length}/${w.length} meetings.</p>
 <div class="scroll"><table class="st"><thead><tr><th>Date</th><th>Opponent</th>${have.map(([k,l])=>`<th title="${esc(pretty(k))}">${esc(l)}</th>`).join("")}</tr></thead><tbody>${d.games.slice().reverse().map(g=>`<tr><td>${esc(fmtD(g))}</td><td>${g.home?"vs":"@"} ${esc(g.opponent)}${g.result?` <span class="m">${esc(g.result)}</span>`:""}</td>${have.map(([k])=>`<td>${g.stats[k]==null?'<span class="na">n/a</span>':esc(+(+g.stats[k]).toFixed(2))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
 ${miss.length?`<p class="m">Not provided by the data source: ${esc(miss.join(", "))}.</p>`:""}${fails}<p class="m">${esc(d.note)}</p>`;
 $("#hk").onchange=e=>{S.hk=e.target.value;h2hRender()}}
function count(el){const to=+el.dataset.c,dp=+el.dataset.d,sf=el.dataset.s||"",t0=performance.now();
 const step=t=>{const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent=(to*e).toFixed(dp)+sf;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function chart(w,thr,sa,hi=0,avgLabel="season average"){
 if(!w.length)return'<p class="m">No games to chart.</p>';
 const W=800,H=260,pl=36,pb=24,pt=18,mx=Math.max(...w.map(g=>g.v),thr,sa)*1.15||1;
 const slot=(W-pl-10)/w.length,bw=Math.min(44,slot*.68),Y=v=>pt+(H-pt-pb)*(1-v/mx),X=i=>pl+slot*i+(slot-bw)/2,base=Y(0);
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Game by game bar chart">
 ${[0,.25,.5,.75,1].map(k=>`<line x1="${pl}" x2="${W-10}" y1="${Y(mx*k)}" y2="${Y(mx*k)}" stroke="#26262f"/><text x="4" y="${Y(mx*k)+4}">${(mx*k).toFixed(0)}</text>`).join("")}
 ${w.map((g,i)=>{const c=g.v>thr?"#3ddc97":g.v<thr?"#ff5d6c":"#9a9aa8",h=Math.max(1,base-Y(g.v));
  return`<g><rect class="bx" style="animation-delay:${i*35}ms" x="${X(i)}" y="${base-h}" width="${bw}" height="${h}" rx="4" fill="${c}" fill-opacity=".85" ${hi&&i>=w.length-hi?'stroke="#6c8cff" stroke-width="2"':""}><title>${esc(fmtD(g))} ${g.home?"vs":"@"} ${esc(g.opp)}: ${+g.v.toFixed(2)}</title></rect>
  ${w.length<=15?`<text class="dot" style="animation-delay:${400+i*35}ms;fill:#ececf1" x="${X(i)+bw/2}" y="${base-h-5}" text-anchor="middle">${+g.v.toFixed(1)}</text>`:""}</g>`}).join("")}
 <line x1="${pl}" x2="${W-10}" y1="${Y(sa)}" y2="${Y(sa)}" stroke="#6c8cff" stroke-opacity=".7"/>
 <line x1="${pl}" x2="${W-10}" y1="${Y(thr)}" y2="${Y(thr)}" stroke="#ffc857" stroke-dasharray="5 4"/><text x="${W-62}" y="${Y(thr)-5}" style="fill:#ffc857">line ${thr}</text>
 <text x="${pl}" y="${H-6}">oldest</text><text x="${W-50}" y="${H-6}">newest</text></svg>
 <p class="m" style="margin:0">Green: over threshold · red: under · grey: push · yellow dashed: your threshold · blue: ${avgLabel}</p>`}

async function src(){const v=$("#app");v.innerHTML='<div class="view"><div class="sk"></div></div>';
 if(!PROXY){v.innerHTML='<div class="view"><div class="card"><h3>Sources &amp; methodology</h3><p class="m">This page reads from the local server. Run <code>node server.js</code> and open http://localhost:8787.</p></div></div>';return}
 try{const d=(await A("/api/sources")).data,by=st=>d.providers.filter(p=>p.status===st),tag={integrated:"integrated",optional:"optional (free key)",dataset:"dataset download",["not-integrated"]:"not integrated"};

   ${p.usedFor?`<p class="m" style="margin:2px 0">Used for: ${esc(p.usedFor)}</p>`:""}${p.reason?`<p class="m" style="margin:2px 0">${esc(p.reason)}</p>`:""}${p.license?`<p class="m" style="margin:2px 0">License / terms: ${esc(p.license)}</p>`:""}${p.limits?`<p class="m" style="margin:2px 0">Limits: ${esc(p.limits)}</p>`:""}${p.env?`<p class="m" style="margin:2px 0">Optional environment variable: <code>${esc(p.env)}</code> (free key, never required)</p>`:""}<p class="m" style="margin:2px 0;font-size:12px"><a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:var(--a)">${esc(p.url)}</a>${p.lastFetched?` · last fetched ${esc(new Date(p.lastFetched).toLocaleString())}`:" · not fetched yet in this session"}</p></div>`;
  v.innerHTML=`<div class="view"><div class="card"><h3 style="margin-top:0">Sources &amp; methodology</h3><p class="m">${esc(d.verification)}</p><p class="m">Everything here is free: no paid API, subscription or credit card is required. Keys are optional and free. No betting lines or sportsbook data are used anywhere.</p>
  <div class="res" style="margin-top:8px">${Object.entries(d.labels).map(([k,t])=>`<span class="pill" style="background:var(--p2)">${kindTag(k)} ${esc(t)}</span>`).join("")}</div></div>
  <div class="card"><h3 style="margin-top:0">Integrated providers</h3>${by("integrated").map(prov).join("")}<h3>Optional (free key) and dataset providers</h3>${by("optional").concat(by("dataset")).map(prov).join("")}<h3>Not integrated, and why</h3>${by("not-integrated").map(prov).join("")}</div>
  <div class="card"><h3 style="margin-top:0">Calculation formulas (locally calculated statistics)</h3><div class="scroll"><table class="st"><thead><tr><th>Statistic</th><th>Sport</th><th>Formula</th></tr></thead><tbody>${d.formulas.map(f=>`<tr><td>${esc(f.label)}</td><td>${esc(f.sport)}</td><td style="white-space:normal;text-align:left">${esc(f.formula)}</td></tr>`).join("")}</tbody></table></div><p class="m">Provider-supplied figures (for example EPA, CPOE, Dots, Wilks, OPS as published) are shown as provided and are never recomputed. A statistic that needs data the free sources do not supply is marked "data unavailable" instead of being estimated.</p>
  <h3>Model estimates</h3><p class="m">${esc(d.model)}</p><h3>Attribution</h3><p class="m">nflverse (CC BY 4.0) · Jeff Sackmann / Tennis Abstract tennis data (CC BY-NC-SA 4.0, non-commercial) · Jolpica F1 · MLB Stats API · NHL web API · ESPN public endpoints (unofficial, personal use) · TheSportsDB (free tier) · Cricsheet · OpenPowerlifting · football-data.org (optional).</p></div></div>`}
 catch(x){v.innerHTML=`<div class="view"><div class="err">Could not load sources: ${esc(x.message)}</div></div>`}}
